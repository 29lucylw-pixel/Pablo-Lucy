<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra historia ❤️</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff7fa;
      color: #4a3039;
    }

    header {
      text-align: center;
      padding: 45px 20px 30px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 16px;
      opacity: 0.75;
    }

    .counter {
      text-align: center;
      margin: 20px auto;
      padding: 22px;
      max-width: 500px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .counter h2 {
      margin: 0 0 10px;
    }

    .number {
      font-size: 28px;
      font-weight: bold;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px 15px;
      border-radius: 20px;
      text-align: center;
      font-size: 18px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .card:hover {
      transform: translateY(-2px);
    }

    footer {
      text-align: center;
      padding: 30px;
      opacity: 0.6;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 30px;
      }

      .menu {
        grid-template-columns: 1fr;
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>♡ Nuestra historia ♡</h1>
    <div class="subtitle">
      Desde el 4 de mayo de 2026
    </div>
  </header>

  <section class="counter">
    <h2>❤️ Llevamos juntos</h2>
    <div class="number" id="together">
      Calculando...
    </div>
  </section>

  <section class="counter">
    <h2>✈️ Volvemos a vernos</h2>
    <div class="number" id="next-meeting">
      Calculando...
    </div>
  </section>

  <div class="menu">

    <a class="card" href="#">
      📸<br>
      Fotos y recuerdos
    </a>

    <a class="card" href="#">
      💌<br>
      Cartas
    </a>

    <a class="card" href="#">
      ✈️<br>
      Viajes
    </a>

    <a class="card" href="#">
      🎵<br>
      Nuestras canciones
    </a>

    <a class="card" href="#">
      📅<br>
      Fechas importantes
    </a>

    <a class="card" href="#">
      📝<br>
      Cosas que queremos hacer
    </a>

  </div>

  <footer>
    Hecho con ❤️ para nosotros
  </footer>

  <script>

    const startDate = new Date("2026-05-04T00:00:00");
    const meetingDate = new Date("2026-09-11T00:00:00");

    function updateCounters() {

      const now = new Date();

      const togetherMilliseconds = now - startDate;

      const togetherDays =
        Math.floor(togetherMilliseconds / (1000 * 60 * 60 * 24));

      document.getElementById("together").textContent =
        togetherDays + " días ❤️";

      const remainingMilliseconds = meetingDate - now;

      if (remainingMilliseconds > 0) {

        const days =
          Math.floor(remainingMilliseconds / (1000 * 60 * 60 * 24));

        const hours =
          Math.floor(
            (remainingMilliseconds / (1000 * 60 * 60)) % 24
          );

        const minutes =
          Math.floor(
            (remainingMilliseconds / (1000 * 60)) % 60
          );

        document.getElementById("next-meeting").textContent =
          days + " días · " +
          hours + " h · " +
          minutes + " min ❤️";

      } else {

        document.getElementById("next-meeting").textContent =
          "¡Ya estamos juntos! ❤️";

      }
    }

    updateCounters();
    setInterval(updateCounters, 60000);

  </script>

</body>
</html>
